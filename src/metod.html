<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" type="text/css" />
    <title>Кафедра информационных технологий</title>
  </head>

  <body>
    <header>
      <div class="container">
        <div class="logo-bstu-it">
          <img src="icon/logo-bstu.svg" alt="" id="logo-bstu" />
          <div class="kafedra-it">
            <a href="index.html" class="logo-link">
              <img src="icon/logo.png" alt="" id="logo" />
              <p>Кафедра информационных технологий</p>
            </a>
          </div>
        </div>
        <nav>
          <ul>
            <li>
              <a href="metod.html" style="margin-left: 0px"
                >Методический кабинет</a
              >
            </li>
            <li><a href="plane.html">Учебные планы</a></li>
            <li><a href="teacher.html">Преподаватели</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <div class="container">
        <div class="login-container">
          <h1>Войти</h1>

          <form class="login-form">
            <label for="username">Почта:</label>
            <input
              type="text"
              name="username"
              required
              placeholder="Введите вашу университетскую почту"
            />
            <p class="error_mail_pas">Неверная почта</p>

            <label for="password">Пароль:</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="Введите ваш пароль"
            />
            <p class="error_mail_pas">Неверный пароль</p>


            <button type="submit" class="btn">Войти</button>
          </form>
        </div>
      </div>
    </main>
    <!-- Уведомление -->
    <div id="copy-notification" class="notification">Номер скопирован</div>

    <footer>
        <div class="container">
            <a href="index.html" class="logo_a"><img src="icon/logo.png" alt="" id="logo" /></a>
            <ul>
                <li><span class="phone">+7 (4722) 55 05 04 — телефон доверия</span></li>
                <li><span class="phone">8 800 222 55 71 — телефон горячей линии МинОбрНауки</span></li>
                <li>&copy; 2000 - 2025 БГТУ им.В.Г.Шухова</li>
            </ul>
        </div>
    </footer>
    <script src="js/main.js"></script>
  </body>
</html>
